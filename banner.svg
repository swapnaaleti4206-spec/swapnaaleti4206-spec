<svg width="800" height="250" viewBox="0 0 800 250" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Background Gradient -->
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0f172a" />
            <stop offset="100%" stop-color="#1e1b4b" />
        </linearGradient>
        
        <!-- Text Gradient -->
        <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#38bdf8" />
            <stop offset="50%" stop-color="#818cf8" />
            <stop offset="100%" stop-color="#c084fc" />
        </linearGradient>
    </defs>

    <style>
        .title {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            font-size: 38px;
            font-weight: 800;
            fill: url(#textGrad);
            text-anchor: middle;
            letter-spacing: 1px;
        }
        .subtitle {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            font-size: 20px;
            font-weight: 500;
            fill: #94a3b8;
            text-anchor: middle;
            letter-spacing: 0.5px;
        }
        .pattern-circle {
            fill: rgba(255, 255, 255, 0.05);
        }
    </style>

    <!-- Background -->
    <rect x="0" y="0" width="800" height="250" rx="16" fill="url(#bgGrad)" />
    
    <!-- Subtle Background Pattern -->
    <g>
        <circle cx="100" cy="50" r="2" class="pattern-circle"/>
        <circle cx="120" cy="50" r="2" class="pattern-circle"/>
        <circle cx="100" cy="70" r="2" class="pattern-circle"/>
        
        <circle cx="700" cy="200" r="2" class="pattern-circle"/>
        <circle cx="680" cy="200" r="2" class="pattern-circle"/>
        <circle cx="700" cy="180" r="2" class="pattern-circle"/>

        <circle cx="400" cy="30" r="2" class="pattern-circle"/>
        <circle cx="420" cy="30" r="2" class="pattern-circle"/>
        <circle cx="400" cy="50" r="2" class="pattern-circle"/>
        
        <!-- Additional circles for visual interest -->
        <circle cx="150" cy="180" r="1.5" class="pattern-circle"/>
        <circle cx="650" cy="70" r="1.5" class="pattern-circle"/>
    </g>

